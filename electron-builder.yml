appId: org.velabrowser.vela
productName: Vela
copyright: Copyright © 2026 Vela contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json
  - "!**/*.map"

asar: true
compression: maximum
electronLanguages:
  - en-US
  - de

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Electron fuses, flipped in the packaged binary (see docs/ARCHITECTURE.md, "Electron fuses").
# grantFileProtocolExtraPrivileges stays on: the chrome UI is loaded from file:// and its ES module
# chunks and @font-face fonts are CORS-mode loads that need the extra file:// privileges.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: true

protocols:
  - name: Web link
    role: Viewer
    schemes:
      - http
      - https

win:
  icon: build/icon.ico
  # No signing options here on purpose: scripts/signing-config.mjs layers azureSignOptions or
  # signtoolOptions.publisherName on top of this file in CI, only when the secrets exist. The
  # publisherName ends up in app-update.yml, and electron-updater only verifies the publisher of
  # a downloaded installer when it is present, so unsigned builds keep updating unsigned builds.
  target:
    - nsis
    - portable

nsis:
  # Default-apps registration (StartMenuInternet, Capabilities, ProgIDs); the portable build has none.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vela
  artifactName: ${productName}-${version}-setup-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}

mac:
  icon: build/icon.icns
  # 'maximum' makes 7-Zip spend ~7 min per arch on the updater zip; the dmg is unaffected.
  compression: normal
  category: public.app-category.productivity
  # Signing is driven by the environment (see docs/RELEASING.md): without CSC_LINK the build stays
  # unsigned/ad-hoc, and notarization only runs when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID are set; otherwise electron-builder logs "skipped macOS notarization".

  # Document types Vela can show (see docs/ARCHITECTURE.md, "Default browser and file types"). Only for
  # macOS (Info.plist CFBundleDocumentTypes) and Linux (.desktop MimeType): on Windows electron-builder
  # would also set each `.ext` default and silently take the type over, so build/installer.nsh
  # registers them Chrome-style instead (ProgIDs, OpenWithProgids, Default apps Capabilities).
  # Formats people usually open elsewhere (txt, json, png, jpg, gif) are left out on purpose.
  fileAssociations: &velaFileTypes
    - ext: [html, htm, shtml]
      name: HTML document
      mimeType: text/html
      role: Viewer
    - ext: [xhtml, xht]
      name: XHTML document
      mimeType: application/xhtml+xml
      role: Viewer
    - ext: [mht, mhtml]
      name: Web archive
      mimeType: multipart/related
      role: Viewer
    - ext: pdf
      name: PDF document
      mimeType: application/pdf
      role: Viewer
      rank: Alternate
    - ext: svg
      name: SVG image
      mimeType: image/svg+xml
      role: Viewer
      rank: Alternate
    - ext: webp
      name: WebP image
      mimeType: image/webp
      role: Viewer
      rank: Alternate
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # Hardened runtime + camera/mic/location entitlements need usage strings, or macOS kills the app
  # the first time a page asks for the device.
  extendInfo:
    NSCameraUsageDescription: A website in Vela wants to use your camera.
    NSMicrophoneUsageDescription: A website in Vela wants to use your microphone.
    NSLocationWhenInUseUsageDescription: A website in Vela wants to know your location.
    NSBluetoothAlwaysUsageDescription: A website in Vela wants to use a Bluetooth device.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    # zip is what electron-updater (Squirrel.Mac) installs from; dmg stays the download for humans.
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  icon: build/icons
  category: Network;WebBrowser
  maintainer: Vela contributors <noreply@github.com>
  synopsis: Fast. Quiet. Isolated.
  # Same file types as mac (YAML anchor). Added to their MIME types and x-scheme-handler/http(s) from `protocols`.
  mimeTypes:
    - application/x-mimearchive
  fileAssociations: *velaFileTypes
  target:
    - AppImage
    - deb

publish:
  provider: github
  owner: Aepzie
  repo: vela
  releaseType: release
