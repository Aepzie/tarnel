name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per slow target so they package in parallel; the release waits for the slowest.
          - name: windows-setup
            os: windows-latest
            args: --win nsis --x64
          - name: windows-portable
            os: windows-latest
            args: --win portable --x64
          - name: macos-arm64
            os: macos-latest
            args: --mac dmg zip --arm64
            arch: arm64
          - name: macos-x64
            os: macos-latest
            args: --mac dmg zip --x64
            arch: x64
          - name: linux
            os: ubuntu-latest
            args: --linux AppImage deb --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (production)
        run: node scripts/build.mjs --production

      # Signing switches itself on once the secrets in docs/RELEASING.md exist; without them (forks,
      # the repo today) every target still packages unsigned. Each secret only reaches the runner
      # OS it belongs to, so the macOS certificate can never be picked up by the Windows signer.
      - name: Configure code signing
        id: signing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ runner.os == 'Windows' && (vars.AZURE_SIGNING_ENDPOINT || secrets.AZURE_SIGNING_ENDPOINT) || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ runner.os == 'Windows' && (vars.AZURE_SIGNING_ACCOUNT || secrets.AZURE_SIGNING_ACCOUNT) || '' }}
          AZURE_SIGNING_PROFILE: ${{ runner.os == 'Windows' && (vars.AZURE_SIGNING_PROFILE || secrets.AZURE_SIGNING_PROFILE) || '' }}
          WIN_PUBLISHER_NAME: ${{ runner.os == 'Windows' && (vars.WIN_PUBLISHER_NAME || secrets.WIN_PUBLISHER_NAME) || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: node scripts/signing-config.mjs

      - name: Package installers
        shell: bash
        run: |
          # Secrets that are not used arrive as empty strings; electron-builder treats a set-but-empty
          # CSC_LINK as a certificate path ("… not a file"), so drop every empty signing variable.
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET WIN_CSC_LINK WIN_CSC_KEY_PASSWORD CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npx electron-builder ${{ matrix.args }} ${{ steps.signing.outputs.args }} --publish never
        env:
          # Unsigned builds must not go looking for a keychain / certificate-store identity.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed == 'true' && 'true' || 'false' }}
          # Windows: Azure Trusted Signing (service principal) or a classic PFX certificate.
          AZURE_TENANT_ID: ${{ steps.signing.outputs.method == 'azure' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.signing.outputs.method == 'azure' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.signing.outputs.method == 'azure' && secrets.AZURE_CLIENT_SECRET || '' }}
          WIN_CSC_LINK: ${{ steps.signing.outputs.method == 'pfx' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ steps.signing.outputs.method == 'pfx' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          # macOS: Developer ID Application certificate (.p12), then notarization via notarytool.
          CSC_LINK: ${{ steps.signing.outputs.method == 'developer-id' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.signing.outputs.method == 'developer-id' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_TEAM_ID || '' }}

      # Each mac job writes a latest-mac.yml listing only its own arch; keep them apart so the
      # publish job can merge them into one feed instead of one overwriting the other.
      - name: Name mac update feed by arch
        if: matrix.arch
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tarnel-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  android:
    name: Package (android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The default list still includes the long-removed "tools" package, which now fails.
          packages: platform-tools

      - name: Install SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: building an unsigned release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tarnel-release.jks"
          echo "file=$RUNNER_TEMP/tarnel-release.jks" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release
        env:
          VELA_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          VELA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VELA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VELA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="dev" ;; esac
          mkdir -p dist
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Tarnel-${version}-android.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/Tarnel-${version}-android-unsigned.apk"
          fi
          rm -f "$RUNNER_TEMP/tarnel-release.jks"
          ls -l dist

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: tarnel-android
          if-no-files-found: error
          path: android/dist/*.apk

  publish:
    name: Publish GitHub Release
    needs: [package, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Same shape electron-builder writes for a combined build: arm64 files first, top-level
      # path/sha512 from x64. yq ships with the Ubuntu runner image.
      - name: Merge mac update feeds
        run: |
          cd artifacts
          yq eval-all '. as $feed ireduce ({}; . *+ $feed)' latest-mac-arm64.yml latest-mac-x64.yml > latest-mac.yml
          rm latest-mac-arm64.yml latest-mac-x64.yml
          test "$(yq '.files | length' latest-mac.yml)" = 4
          cat latest-mac.yml
          ls -la

      - name: Generate checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Tarnel ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
