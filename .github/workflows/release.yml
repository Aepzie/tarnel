name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per slow target so they package in parallel; the release waits for the slowest.
          - name: windows-setup
            os: windows-latest
            args: --win nsis --x64
          - name: windows-portable
            os: windows-latest
            args: --win portable --x64
          - name: macos-arm64
            os: macos-latest
            args: --mac dmg zip --arm64
            arch: arm64
          - name: macos-x64
            os: macos-latest
            args: --mac dmg zip --x64
            arch: x64
          - name: linux
            os: ubuntu-latest
            args: --linux AppImage deb --x64
    env:
      # Unsigned builds until code-signing certificates are configured.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (production)
        run: node scripts/build.mjs --production

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Each mac job writes a latest-mac.yml listing only its own arch; keep them apart so the
      # publish job can merge them into one feed instead of one overwriting the other.
      - name: Name mac update feed by arch
        if: matrix.arch
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vela-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Same shape electron-builder writes for a combined build: arm64 files first, top-level
      # path/sha512 from x64. yq ships with the Ubuntu runner image.
      - name: Merge mac update feeds
        run: |
          cd artifacts
          yq eval-all '. as $feed ireduce ({}; . *+ $feed)' latest-mac-arm64.yml latest-mac-x64.yml > latest-mac.yml
          rm latest-mac-arm64.yml latest-mac-x64.yml
          test "$(yq '.files | length' latest-mac.yml)" = 4
          cat latest-mac.yml
          ls -la

      - name: Generate checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Vela ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
