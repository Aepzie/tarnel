name: Bug report
description: Something in Tarnel is broken or behaves unexpectedly.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        **Security vulnerabilities must not be reported here** — see [SECURITY.md](https://github.com/Aepzie/tarnel/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a new Space
        2. Open https://example.com
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tarnel version
      description: Shown in tarnel://settings, or the version of the release you installed.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (deb)
        - Other
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install Tarnel?
      options:
        - Release installer
        - Portable build
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Spaces / sessions
        - Burner spaces
        - Tabs / tab sleeping
        - Ad blocking
        - Command palette / address bar
        - Find bar
        - Downloads
        - Settings / new tab page
        - Performance / memory
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output (when run from source), DevTools console errors, or screenshots. Remove any personal data.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: The issue still happens with ad blocking disabled (if it is site-related).
